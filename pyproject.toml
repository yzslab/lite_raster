[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lite-raster"
version = "0.7.1"
description = "Single-view CUDA Gaussian projection and rasterization for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch"]

[tool.setuptools]
packages = ["lite_raster"]
license-files = ["LICENSE-gsplat", "LICENSE-fused-ssim"]

[tool.setuptools.package-data]
lite_raster = ["csrc/*.cu", "csrc/*.cuh"]
